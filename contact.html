<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="프로덕트 빌더 강의에 제휴, 기고, 문의를 보낼 수 있는 페이지.">
    <title>문의 — 프로덕트 빌더 강의</title>
    <link rel="stylesheet" href="style.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9481279707626249"
        crossorigin="anonymous"></script>
</head>
<body>
    <header class="site-header">
        <a class="site-title" href="index.html">프로덕트 빌더 강의</a>
        <nav class="site-nav" aria-label="주 메뉴">
            <a href="index.html">홈</a>
            <a href="lesson-discovery.html">강의</a>
            <a href="about.html">소개</a>
            <a href="contact.html" aria-current="page">문의</a>
        </nav>
        <button id="theme-toggle" type="button" aria-label="색상 테마 전환">Dark mode</button>
    </header>

    <main class="article">
        <h1>문의</h1>
        <p>
            제휴, 기고, 강의 주제 제안, 또는 일반 문의는 아래 폼으로 보내주세요. 보통 영업일 기준 2~3일 안에
            회신드립니다. 비공개로 다뤄야 하는 내용은 댓글 대신 이 폼을 이용해 주세요.
        </p>

        <section id="contact">
            <form id="contact-form" action="https://formspree.io/f/mojryeye" method="POST">
                <label>
                    이름
                    <input type="text" name="name" required>
                </label>
                <label>
                    이메일
                    <input type="email" name="email" required>
                </label>
                <label>
                    회사명 (선택)
                    <input type="text" name="company">
                </label>
                <label>
                    문의 내용
                    <textarea name="message" rows="5" required></textarea>
                </label>
                <button type="submit">보내기</button>
                <p id="contact-status" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 프로덕트 빌더 강의</p>
        <p>
            <a href="privacy.html">개인정보처리방침</a>
            ·
            <a href="contact.html">문의</a>
        </p>
    </footer>

    <script src="main.js"></script>
</body>
</html>
